    audioUrl:"https://pan.29o.cn/view.php/aa9bc85e6edd6e0abe40888ecee6216a.mp3",

    headerFallbackImg:"http://cccimg.com/view.php/072d6566eb605bb0ac92528feeac4b1c.jpg"

<div class="page-header-box">
    <img class="header-fallback" id="headerFallback">
    <video id="mainVideo" class="page-header-video" autoplay muted loop playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" preload="none">
        <source id="videoSrc" type="video/mp4">
    </video>
    <div class="page-header-overlay"></div>
    <div class="page-header-text-wrap">
        <div class="page-main-title">石昊电竞打手入驻</div>

</div>

    <img id="bannerPic">
</div>

<div class="jump-btn-wrap">
    <button class="jump-button" id="linkBtn"></button>
</div>

<audio id="bgMusic" loop preload="auto">

<script>
const bannerPic = document.getElementById("bannerPic");
const noticeBox = document.getElementById("noticeBox");
const ruleBox = document.getElementById("ruleBox");
const videoSrc = document.getElementById("videoSrc");
const pageVideo = document.getElementById("mainVideo");
const headerFallback = document.getElementById("headerFallback");
const linkBtn = document.getElementById("linkBtn");
const audioDom = document.getElementById("bgMusic");

bannerPic.src = pageConfig.bannerImg;
noticeBox.innerText = pageConfig.noticeContent;
ruleBox.innerText = pageConfig.ruleContent;
videoSrc.src = pageConfig.videoUrl;
headerFallback.src = pageConfig.headerFallbackImg;
linkBtn.innerText = pageConfig.btnText;
audioDom.src = pageConfig.audioUrl;

let musicPlay = false;

function tryPlay(){
    pageVideo.load();
    pageVideo.play().catch(()=>{
        pageVideo.style.display = "none";
    })
}
if(window.WeixinJSBridge){
    WeixinJSBridge.invoke('getNetworkType',{},tryPlay);
}else{
    document.addEventListener("WeixinJSBridgeReady", tryPlay, false);
}

pageVideo.addEventListener('ended',()=>{
    pageVideo.currentTime = 0;
    pageVideo.play();
})

pageVideo.addEventListener('error', () => {
    pageVideo.style.display = "none";
})

// 缩短超时到1.8秒，更快切到静态海报，提升微信体验
setTimeout(()=>{
    if(pageVideo.readyState < 2){
        pageVideo.style.display = "none";
    }
},1800)

document.body.addEventListener('touchstart', tryPlay, {once:true})

linkBtn.onclick = function(){
    window.location.href = pageConfig.jumpUrl;
};
document.getElementById("musicCtrlBtn").onclick = function(){
    if(!musicPlay){
        audioDom.play();
        this.innerText = "🔇 关闭背景音乐";
        musicPlay = true;
    }else{
        audioDom.pause();
        this.innerText = "🎵 点击开启背景音乐";
        musicPlay = false;
    }
}
</script>
